name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Ingest seed data
        run: |
          PYTHONPATH=. python ml/data/seed_data.py

      - name: Run pytest
        run: |
          PYTHONPATH=. pytest tests/ -v

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install contract dependencies
        run: |
          cd contracts
          npm ci

      - name: Run Hardhat tests
        run: |
          cd contracts
          npx hardhat test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: |
          cd apps/web
          npm ci

      - name: Build Next.js
        run: |
          cd apps/web
          npm run build
